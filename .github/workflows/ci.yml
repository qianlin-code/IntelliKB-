# IntelliKB CI
# Phase 11: 基础 CI — Python 语法检查 + 前端构建

name: CI

on:
  push:
    branches: [main, feature-*, fix-*]
  pull_request:
    branches: [main]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: |
          find app -name "*.py" -exec python -c "compile(open('{}',encoding='utf-8').read(),'{}','exec')" \;

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx vite build
