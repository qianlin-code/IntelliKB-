# IntelliKB Docker Compose
# Phase 11: 优化版 — 数据卷持久化 + 健康检查 + 非 root 用户
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-intellikb}
      MYSQL_USER: ${DB_USER:-intellikb}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-u",
          "${DB_USER:-intellikb}",
          "-p${DB_PASSWORD}",
          "-h",
          "localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then
               redis-server --requirepass \"$${REDIS_PASSWORD}\";
             else
               redis-server;
             fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [
          "CMD-SHELL",
          'if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-cli -a "$${REDIS_PASSWORD}" ping;
          else
          redis-cli ping;
          fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: intellikb:latest
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # 数据库
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-intellikb}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-intellikb}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # JWT
      - SECRET_KEY=${SECRET_KEY}
      # LLM
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434/v1}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-qwen2.5:7b}
      - AGENT_MODEL=${AGENT_MODEL:-qwen2.5:7b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      # Cloud
      - CLOUD_BASE_URL=${CLOUD_BASE_URL:-}
      - CLOUD_API_KEY=${CLOUD_API_KEY:-}
      - CLOUD_LLM_CONFIRMED=${CLOUD_LLM_CONFIRMED:-false}
      # Reranker
      - RERANK_ENABLED=${RERANK_ENABLED:-true}
      - RERANK_LOCAL_DIR=/app/reranker_models
      # 应用
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # 配额
      - QUOTA_ENABLED=${QUOTA_ENABLED:-false}
    volumes:
      # 数据持久化
      - uploads_data:/app/uploads
      - reranker_models:/app/reranker_models
      - chroma_data:/app/chroma_data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    # Phase 11: 非 root 用户运行 (UID 1000)
    user: "1000:1000"

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  reranker_models:
    driver: local
  chroma_data:
    driver: local
