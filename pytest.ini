[pytest]
asyncio_mode = auto
# 单元测试使用 session 级事件循环。
# app/core/database.py 的 engine 是模块级单例，其连接池绑定到创建时的
# 事件循环。统一 fixture 和 test 的事件循环作用域为 session，
# 避免 fixture（session 级循环）和 test（function 级循环）之间的
# "Task got Future attached to a different loop" RuntimeError。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests

markers =
    integration: integration tests requiring live backend services

# ── Windows teardown 警告过滤 ──
# Windows ProactorEventLoop 在测试 teardown 阶段可能触发以下异常/警告：
#   1. RuntimeError: Event loop is closed
#   2. RuntimeError: Task got Future attached to a different loop
#   3. PytestUnhandledThreadExceptionWarning
#
# RuntimeError 不是 Warning 子类，无法通过 pytest.ini 的 filterwarnings 过滤。
# 它通过 fixture cleanup 中的 try/except 捕获（见 tests/integration/conftest.py）。
# 以下仅过滤可配置的 Warning 子类。
filterwarnings =
    ignore::pytest.PytestUnhandledThreadExceptionWarning
